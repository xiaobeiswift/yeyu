<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>save_slot 资源一览</title>
  <style>
    :root {
      --bg: #0b1214;
      --card: #141c1f;
      --gold: #c9a45c;
      --fog: #a8b8b6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      background: var(--bg);
      color: var(--fog);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }
    h1 {
      font-family: KaiTi, STKaiti, serif;
      color: var(--gold);
      letter-spacing: 0.2em;
      font-weight: 500;
    }
    a { color: var(--gold); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(201, 164, 92, 0.25);
      border-radius: 6px;
      padding: 12px;
    }
    .card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      background: #1a1a1a;
      border-radius: 4px;
    }
    .card.tall img { height: 220px; }
    .card.wide img { height: 80px; }
    .name {
      margin-top: 10px;
      font-size: 12px;
      word-break: break-all;
      color: #e8d09a;
    }
    .meta { font-size: 11px; color: #6a7c7e; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>save_slot · 生成资源</h1>
  <p>
    界面原型：<a href="save_slot.html">save_slot.html</a>
    · 源目录 <code>../generated/</code>
  </p>
  <div class="grid" id="grid"></div>
  <script>
    var items = [
      { f: "panel_slot.png", t: "tall", d: "槽卡片框 · 九宫格" },
      { f: "panel_slot_selected.png", t: "tall", d: "选中槽框" },
      { f: "panel_modal.png", t: "", d: "锁定弹窗框" },
      { f: "btn_primary_normal.png", t: "wide", d: "主按钮 normal" },
      { f: "btn_primary_hover.png", t: "wide", d: "主按钮 hover" },
      { f: "btn_primary_pressed.png", t: "wide", d: "主按钮 pressed" },
      { f: "btn_secondary_normal.png", t: "wide", d: "次按钮 normal" },
      { f: "btn_secondary_hover.png", t: "wide", d: "次按钮 hover" },
      { f: "btn_danger_normal.png", t: "wide", d: "删档按钮 normal" },
      { f: "btn_danger_hover.png", t: "wide", d: "删档按钮 hover" },
      { f: "btn_ghost_normal.png", t: "wide", d: "返回按钮 normal" },
      { f: "icon_empty_slot.png", t: "", d: "空槽 +" },
      { f: "icon_cloud_lock.png", t: "", d: "云档锁定" },
      { f: "icon_backend_local.png", t: "", d: "本地档 Tab" },
      { f: "icon_backend_cloud.png", t: "", d: "云档 Tab" },
      { f: "portrait_ring.png", t: "", d: "选中头像环" },
    ];
    var root = document.getElementById("grid");
    items.forEach(function (it) {
      var card = document.createElement("div");
      card.className = "card " + (it.t || "");
      card.innerHTML =
        '<img src="../generated/' + it.f + '" alt="' + it.f + '" loading="lazy" />' +
        '<div class="name">' + it.f + '</div>' +
        '<div class="meta">' + it.d + '</div>';
      root.appendChild(card);
    });
  </script>
</body>
</html>
